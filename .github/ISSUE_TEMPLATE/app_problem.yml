name: App problem
description: Menus, settings, controls, touch, the VitaSim UI, the first start or updates do not work
labels: ["app"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to see it
      placeholder: |
        1. Open ...
        2. Press ...
  - type: dropdown
    id: touch
    attributes:
      label: Touch mode
      options:
        - Direct touch
        - Trackpad
        - Not about touch
  - type: input
    id: version
    attributes:
      label: VitaSim version
      description: Shown in Settings > About (for example v0.16.4)
    validations:
      required: true
  - type: dropdown
    id: ui
    attributes:
      label: Interface
      options:
        - VitaSim UI
        - Original
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - PS Vita 1000 (OLED)
        - PS Vita 2000 (Slim)
        - PS TV
    validations:
      required: true
  - type: textarea
    id: shots
    attributes:
      label: Screenshot or video (optional)
