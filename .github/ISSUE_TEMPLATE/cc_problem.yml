name: Custom content problem
description: Custom objects, skins, walls or floors in Downloads do not show up, show without an icon or cannot be placed
labels: ["cc"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: Which items (their names in the catalog), and what you see
    validations:
      required: true
  - type: input
    id: count
    attributes:
      label: Size of your Downloads folder
      description: Roughly how many .iff and .far files (subfolders included)
  - type: input
    id: where
    attributes:
      label: Where the files came from (optional)
      description: The site or set name, so we can test the same files
  - type: input
    id: version
    attributes:
      label: VitaSim version
      description: Shown in Settings > About (for example v0.16.4)
    validations:
      required: true
  - type: dropdown
    id: ui
    attributes:
      label: Interface
      options:
        - VitaSim UI
        - Original
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - PS Vita 1000 (OLED)
        - PS Vita 2000 (Slim)
        - PS TV
    validations:
      required: true
  - type: textarea
    id: shots
    attributes:
      label: Screenshot or video (optional)
